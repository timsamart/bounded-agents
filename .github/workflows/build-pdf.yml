name: Build PDF

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install Python deps
        run: |
          pip install playwright pypdf
          playwright install --with-deps chromium

      - name: Build PDF
        run: python build/build_spine_pdf.py

      - name: Verify links
        run: python build/verify_links.py

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: bounded-agents-pdf
          path: build/bounded-agents.pdf

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: build/bounded-agents.pdf
          generate_release_notes: true
          body: |
            Edition draft PDF for **Bounded Agents** (*Governed Agentic Infrastructure*).

            Manuscript: CC BY 4.0 · Scripts: Apache-2.0
            https://github.com/timsamart/bounded-agents
